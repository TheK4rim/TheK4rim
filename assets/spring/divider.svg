<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 40" width="1200" height="40" role="img" aria-label="Spring divider"><defs><linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#FF7AA8" stop-opacity="0"/><stop offset=".5" stop-color="#FF7AA8" stop-opacity=".85"/><stop offset="1" stop-color="#FF7AA8" stop-opacity="0"/></linearGradient></defs><style>
.fall{animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
.diag{animation-name:diag;animation-timing-function:linear;animation-iteration-count:infinite}
.rise{animation-name:rise;animation-timing-function:linear;animation-iteration-count:infinite}
.s1,.s2,.s3{animation-timing-function:ease-in-out;animation-iteration-count:infinite;animation-direction:alternate}
.s1{animation-name:s1}.s2{animation-name:s2}.s3{animation-name:s3}
.spin{animation-name:spin;animation-timing-function:linear;animation-iteration-count:infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:tw ease-in-out infinite alternate}
.drift{animation:drift 16s ease-in-out infinite alternate}
.glow{animation:glow 7s ease-in-out infinite alternate}
.pulse{animation:pulse 5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.rays{animation:spin 70s linear infinite;transform-box:fill-box;transform-origin:center}
.wave{animation-name:wave;animation-timing-function:linear;animation-iteration-count:infinite}
.fly{animation:fly linear infinite}
.flap{animation:flap .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.bob{animation:bob 3.2s ease-in-out infinite alternate}
@keyframes fall{from{transform:translateY(-40px)}to{transform:translateY(400px)}}
@keyframes diag{from{transform:translate(60px,-40px)}to{transform:translate(-190px,400px)}}
@keyframes rise{0%{transform:translateY(380px);opacity:0}15%{opacity:.85}85%{opacity:.85}100%{transform:translateY(-40px);opacity:0}}
@keyframes s1{from{transform:translateX(-6px)}to{transform:translateX(6px)}}
@keyframes s2{from{transform:translateX(-13px)}to{transform:translateX(13px)}}
@keyframes s3{from{transform:translateX(-22px)}to{transform:translateX(22px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{from{opacity:.12}to{opacity:1}}
@keyframes drift{from{transform:translateX(-45px)}to{transform:translateX(45px)}}
@keyframes glow{from{opacity:.45}to{opacity:.95}}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.06)}}
@keyframes wave{from{transform:translateX(0)}to{transform:translateX(-200px)}}
@keyframes fly{from{transform:translateX(-140px)}to{transform:translateX(1340px)}}
@keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.static{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.typing{display:none}.static{display:inline}}
</style><rect x="60" y="19" width="1080" height="2" rx="1" fill="url(#line)"/><g transform="translate(240 20)"><g class="bob" style="animation-delay:-0.0s"><g fill="#FFC1D6" stroke="#FF8FB5" stroke-width="0.8"><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(0)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(72)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(144)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(216)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(288)"/></g><circle r="1.8" fill="#E85A8C"/></g></g><g transform="translate(420 20)"><g class="bob" style="animation-delay:-0.6s"><g fill="#FFC1D6" stroke="#FF8FB5" stroke-width="0.8"><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(0)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(72)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(144)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(216)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(288)"/></g><circle r="1.8" fill="#E85A8C"/></g></g><g transform="translate(600 20)"><g class="bob" style="animation-delay:-1.2s"><g fill="#FFC1D6" stroke="#FF8FB5" stroke-width="0.8"><ellipse cx="0" cy="-6.1" rx="4.2" ry="6.1" transform="rotate(0)"/><ellipse cx="0" cy="-6.1" rx="4.2" ry="6.1" transform="rotate(72)"/><ellipse cx="0" cy="-6.1" rx="4.2" ry="6.1" transform="rotate(144)"/><ellipse cx="0" cy="-6.1" rx="4.2" ry="6.1" transform="rotate(216)"/><ellipse cx="0" cy="-6.1" rx="4.2" ry="6.1" transform="rotate(288)"/></g><circle r="2.4" fill="#E85A8C"/></g></g><g transform="translate(780 20)"><g class="bob" style="animation-delay:-1.8s"><g fill="#FFC1D6" stroke="#FF8FB5" stroke-width="0.8"><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(0)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(72)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(144)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(216)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(288)"/></g><circle r="1.8" fill="#E85A8C"/></g></g><g transform="translate(960 20)"><g class="bob" style="animation-delay:-2.4s"><g fill="#FFC1D6" stroke="#FF8FB5" stroke-width="0.8"><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(0)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(72)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(144)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(216)"/><ellipse cx="0" cy="-4.8" rx="3.2" ry="4.8" transform="rotate(288)"/></g><circle r="1.8" fill="#E85A8C"/></g></g></svg>
