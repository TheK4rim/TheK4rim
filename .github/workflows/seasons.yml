name: seasonal profile

on:
  schedule:
    - cron: "7 0 * * *"        # every day at 00:07 UTC
  workflow_dispatch:            # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/seasons.yml"

permissions:
  contents: write

concurrency:
  group: seasonal-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Regenerate the artwork and today's README
        run: |
          python3 scripts/make_assets.py
          python3 scripts/update_readme.py

      - name: Commit and push if anything changed
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md seasons assets
          git commit -m "Seasonal profile update for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase origin main
          done
          exit 1
